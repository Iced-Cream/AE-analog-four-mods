[[detour]]
owner  = "0006-fx-slot"
addr   = 0x4000c920
size   = 6
expect = "4fefffdc48d77c3c"
entry  = "copy2_gate"

# fx_copy_v4 entry (working kit -> storage kit: the save): the spare bytes from

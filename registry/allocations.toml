# Played notes: track_play_note at its entry, the one routine both the trig keys and
# note events reach. (The first build hooked handleNoteEvent 0x40060c20 instead,
# which trig keys never pass through - found on hardware, 2026-10-09.) The jmp
# covers `linkw %fp,#-88; moveq #127,%d0` exactly; both are re-emitted.
[[detour]]

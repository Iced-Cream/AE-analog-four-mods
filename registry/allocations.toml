# Single source of truth for every scarce resource a mod can claim - Analog Four
# MKII, OS 1.56. PORTED from the MK1 OS 1.56 registry (branch OS-1.56) on
# 2026-10-21, docs/PORT-MK2.md: every claim below keeps its MK1 address in a
# `# MK1:` line, and an `expect` that differs on the MKII keeps the MK1 bytes after
# it. Other comments still describe the MK1 image unless they say MKII.
#
# Same rules as before: tools/layout.py asserts that no two claims overlap and that
# every claim sits inside its pool; tools/build.py checks every `expect` against
# the stock bytes before patching.
#
# owner = the mod directory name, or "reserved:<reason>".

[meta]
target = "OS1.56"
device = "Analog Four MKII"

# ---------------------------------------------------------------- the image
#
# From the MKII startup code (entry 0x40001130, the image's first long):
#   0x400010a4  copies 0x40253000..0x4025af68 to SRAM 0x80000000 and
#               0x4025af68..0x40262e38 (the image's end) to 0x80008000.
#   0x400010fa  zeroes 0x40253000..0x448b6d50: __bss_start = 0x40253000.
# So everything at or above 0x40253000 is initialiser data and then .bss, and
# NOTHING below it is .bss.
#
# Unlike the MK1 there is no bootstrap inside MAIN OS: the MKII's bootstrap is
# section 2 of the container, which no build touches (tools/verify.py compares it,
# and every other section, with stock).

# ---------------------------------------------------------------------- pools

[[pool]]
name   = "cave"
start  = 0x40252940
end    = 0x40253000          # exclusive; 1728 B
status = "probably-verified"
note   = """
The MKII twin of the MK1's `cave`: alignment padding between the end of the C++
static-constructor table and the first SRAM load image.

Evidence, all static, on the MKII 1.56 image (re/mk2/zeroruns.py):
- 0x4025293c..0x40253000 is zeros. The pool starts 4 bytes in to keep claims
  8-byte aligned.
- Just below is the constructor table: count 132 at 0x40252728, entries from
  0x4025272c, so it ends exactly at 0x4025293c. Its only reader, 0x40105fc0, loads
  the count and loops by it.
- The only 32-bit words in the image that point into 0x4025293c..0x40253000 are
  0x40253000 itself (its end), at 0x400010a8 and 0x40001104 (the SRAM copy and the
  .bss clear) and 0x40003adc / 0x40003b10 (a variable at 0x40253000, in .bss).
- 0x40253000 is where both the SRAM copy and the .bss clear start; the gap is below
  both and nothing else writes it.
The MK1's twin (1952 B there) has run every mod on an MK1. On the MKII: not yet
run on hardware.
"""

[[pool]]
name   = "cave2"
start  = 0x40093bb2
end    = 0x40093ea8          # exclusive; 758 B
stock  = "code"
expect_sha256 = "f9d01c2c5154c1f94518285689f5cb1a752382837e775ee70f6fc984b6b354e9"
status = "candidate"
note   = """
MKII 1.56 dead code: the twin of the MK1's cave2 (a 758 B function, 64-bit
arithmetic), matched by xmatch (vote 48 at its start).
Evidence: re/mk2/deadscan_mk2.py on the MKII image - no branch or call target, no
32-bit word anywhere in the image, and no case of any of its 74 switch tables lands
in 0x40093bb2..0x40093ea8. The scan flags a computed jump in the routine before it
(J), as it did on the MK1, where the run was also checked against emulator
coverage. Not yet covered in an emulator on the MKII, not run on hardware.
"""

[[pool]]
name   = "cave3"
start  = 0x40215258
end    = 0x40215658          # exclusive; 1024 B
status = "probably-verified"
note   = """
The chorus gap, as on the MK1 (0x401eeb08 there): 1,024 zero bytes between the
chorus's lookup tables. The only word in the image that points into or at it is
0x40215658 (its end, the next table) at 0x400fe214, in the chorus code, which is
the MK1's instruction for instruction (signed-byte indexing; 0010's cho_gate clamps
the one index that could reach the gap).
"""

[[pool]]
name   = "cave4"
start  = 0x401845be
end    = 0x4018471e          # exclusive; 352 B
stock  = "code"
expect_sha256 = "418ecf1dab82e1df465fdcb2e34607ddf0163b39b4277ebfd15088ceadee8358"
status = "candidate"
note   = """
MKII 1.56 dead code: 8 small string helpers just before string_from_cstr
(0x4018471e), the twin of the MK1's cave4. re/mk2/deadscan_mk2.py: nothing
references them. Not yet covered in an emulator on the MKII, not run on hardware.
"""

[[pool]]
name   = "cave5"
start  = 0x40090754
end    = 0x400908ac          # exclusive; 344 B
stock  = "code"
expect_sha256 = "7f8806d7213e35ffd8ce4d89d7408532022e26388da0bf19ca63cde7c9878128"
status = "candidate"
note   = """
MKII 1.56 dead code: 12 wrapper functions, the twin of the MK1's cave5.
re/mk2/deadscan_mk2.py: nothing references them. Not yet covered in an emulator on
the MKII, not run on hardware.
"""

[[pool]]
name   = "cave6"
start  = 0x40056e14
end    = 0x40056f52          # exclusive; 318 B
stock  = "code"
expect_sha256 = "d2cceab7c4baea35d682c1ecd3ce658808754647444ac55eb116a38bd61637aa"
status = "candidate"
note   = """
MKII 1.56 dead code: 11 small accessors (the scan's run is 0x40056e12..0x40056f52;
the pool starts at the next 4-byte boundary, as the MK1's did), the twin of the
MK1's cave6. re/mk2/deadscan_mk2.py: nothing references them. Not yet covered in an
emulator on the MKII, not run on hardware.
"""


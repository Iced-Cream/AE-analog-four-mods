[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40022fb4
size   = 6
expect = "4feffff448d7040c"
entry  = "note_delta_gate"

# The NOTE encoder with trigs held, per held trig: lock_delta_apply at its entry.
# The jmp lands across the prologue's lea and the first half of the moveml; both
# are re-emitted.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40023518
size   = 6
expect = "4feffff048d7041c"
entry  = "lock_delta_gate"

# The NOTE encoder on a directly edited lock: the held-trig routine's
# `lea %sp@(12),%sp; addl %d5,%d0`. The lea is re-emitted; the add is
# REIMPLEMENTED (for NOTE, note_step computes the new value; for anything else the
# stub performs the stock add on a line of its own), so the displaced pair is not
# present verbatim.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40023c38
size   = 6
expect = "4fef000cd085"
entry  = "lock_add_gate"
reemit = false

# The KEY SCALE value text. Stock pushes names[value] from a 3-entry stack copy;
# the stub pushes the name itself and re-emits only the first instruction. The
# second, the indexed push, is REIMPLEMENTED (it would read past the copy for every
# new value), so the displaced pair is not present verbatim.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400d64c6
size   = 6
expect = "206e00142f360cf4"
entry  = "key_scale_name"
reemit = false


# MK1: 0x40234860
[[cave]]
owner = "0001-scale-lock"
addr  = 0x40252940
size  = 0x2d0
note  = "719 B: the six hooks (played notes, step entry, the NOTE encoder's three paths, KEY SCALE name), note_step, the track-lock lookup, the snap and the 35-entry scale remap."

# Played notes: track_play_note at its entry, the one routine both the trig keys and
# note events reach. (The first build hooked handleNoteEvent 0x40060c20 instead,
# which trig keys never pass through - found on hardware, 2026-10-09.) The jmp
# covers `linkw %fp,#-88; moveq #127,%d0` exactly; both are re-emitted.
# MK1: 0x400b9818
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400bce08
size   = 6
expect = "4e56ffa8707f"
entry  = "play_gate"

# Step entry (hold a trig + play a key): set_step_note at its entry. The jmp lands
# across the prologue's lea and the first half of the moveml; both are re-emitted.
# MK1: 0x400ac934
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400afa38
size   = 6
expect = "4feffff048d7041c"
entry  = "step_gate"

# The NOTE encoder, no trig held: param_apply_delta at its entry, as rytm-mods' 0002
# does. The stub rewrites the delta argument and continues into stock; both prologue
# instructions are re-emitted. (The first two builds compared the id with 30, the
# track's Level - NOTE is 19 - so this never fired; fixed 2026-10-09.)
# MK1: 0x40022fb4
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400232e2
size   = 6
expect = "4feffff448d7040c"
entry  = "note_delta_gate"

# The NOTE encoder with trigs held, per held trig: lock_delta_apply at its entry.
# The jmp lands across the prologue's lea and the first half of the moveml; both
# are re-emitted.
# MK1: 0x40023518
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x4002388a
size   = 6
expect = "4feffff048d7041c"
entry  = "lock_delta_gate"

# The NOTE encoder on a directly edited lock: the held-trig routine's
# `lea %sp@(12),%sp; addl %d5,%d0`. The lea is re-emitted; the add is
# REIMPLEMENTED (for NOTE, note_step computes the new value; for anything else the
# stub performs the stock add on a line of its own), so the displaced pair is not
# present verbatim.
# MK1: 0x40023c38
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40023faa
size   = 6
expect = "4fef000cd085"
entry  = "lock_add_gate"
reemit = false

# The KEY SCALE value text. Stock pushes names[value] from a 3-entry stack copy;
# the stub pushes the name itself and re-emits only the first instruction. The
# second, the indexed push, is REIMPLEMENTED (it would read past the copy for every
# new value), so the displaced pair is not present verbatim.
# MK1: 0x400d64c6
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400dbc8a
size   = 6
expect = "206e00142f360cf4"
entry  = "key_scale_name"
reemit = false


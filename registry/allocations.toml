# Single source of truth for every scarce resource a mod can claim - Analog Four /
# Analog Keys MK1, OS 1.55. Same rules as rytm1_mods-main's registry: tools/layout.py
# asserts that no two claims overlap and that every claim sits inside its pool;
# tools/build.py checks every `expect` against the stock bytes before patching.
#
# owner = the mod directory name, or "reserved:<reason>".

[meta]
target = "OS1.55"
device = "Analog Four / Analog Keys MK1"

# ---------------------------------------------------------------- the image
#
# From the startup code (entry 0x40000e52, the image's first long):
#   0x40000dc6  copies 0x40235000..0x4023c4a0 to SRAM 0x80000000 and
#               0x4023c4a0..0x402437e0 (the image's end) to 0x80008000.
#   0x40000e1c  zeroes 0x40235000..0x4260fb10: __bss_start = 0x40235000.
# So everything at or above 0x40235000 is initialiser data and then .bss, and
# NOTHING below it is .bss. tools/cavescan.py reads these bounds out of the image.
#
# THE TRAP, as on the Rytm MK1: 0x40226958..0x40233a30 is the bootstrap, embedded in
# MAIN OS. At every boot 0x40000e6a compares its version word (0x40226958) with the
# one in flash (0xfff8) and, if it is newer, 0x401006dc writes 0x40226960..0x40233a30
# into the bootstrap sectors. A mod byte in that range could one day be written into
# the recovery path. No pool may touch it, and build and verify assert its hash.

# ---------------------------------------------------------------------- pools

[[pool]]
name   = "cave"
start  = 0x40234860
end    = 0x40235000          # exclusive; 1952 B
status = "probably-verified"
note   = """
The A4 twin of the Rytm MK1's cave2 (which is the twin of MKII cave2, run on
hardware with 0003 and 0004): alignment padding between the end of the read-only
data and the first SRAM load image.

Evidence, all static, on this image (tools/cavescan.py):
- 0x40234858..0x40235000 is zeros. The pool starts 8 bytes in to keep claims aligned.
- Just below is the C++ static-constructor table: count 122 at 0x4023466c, entries
  from 0x40234670, so it ends exactly at 0x40234858. Its only reader, 0x400ff76a,
  loops by that count.
- No 32-bit word at any even offset in the image points into 0x40234858..0x40235000.
- 0x40235000 is where both the SRAM copy (0x40000dc6) and the .bss clear
  (0x40000e1c) start; the gap is below both and nothing else writes it.

"probably-verified" rather than "candidate" on the same complete static case the
Rytm MK1 project used for its twin: below __bss_start, so nothing clears or reuses
it; above the last constructor, so nothing reads it as a table; nothing points into
it.

Hardware, 2026-10-09: 0001 has run from here across three flashes - boot, menus,
playing, step entry - with no fault.
"""

[[pool]]
name   = "cave2"
start  = 0x40233a40
end    = 0x40234000          # exclusive; 1472 B
status = "probably-verified"
note   = """
The A4 twin of the Rytm MK1's cave: padding right after the EMBEDDED BOOTSTRAP
IMAGE, whose exclusive end 0x40233a30 is the flasher's loop bound (cmpil at
0x401007d4), and before the UTF-16 USB strings at 0x40234000.

Evidence: 0x40233a25..0x40234001 is zeros; the only word in the image pointing into
0x40233a28..0x40234000 is that loop bound. The pool keeps 16 bytes clear of the
image's end on purpose.

Hardware, 2026-10-09: the 0004 probe ran from here (code and state written every
audio interrupt) through a playing session with no fault and plausible readings.
"""

[[pool]]
name   = "cave3"                # the chorus gap
start  = 0x401ee578
end    = 0x401ee978          # exclusive; 1024 B
status = "probably-verified"
note   = """
1,024 zero bytes between the chorus's lookup tables (0x401edf78, 0x401ee178,
0x401ee378 below, 0x401ee978 above), checked 2026-10-14:
- No 32-bit word at any even offset in the image points into 0x401ee578..0x401ee978.
- The chorus (0x400f7f6c..) indexes its tables by signed bytes (mvsb from
  0x8000517e/80, x4): 0x401ee378 reaches at most 0x401ee574, and 0x401ee978 reaches
  down into the gap's upper half only with a negative index - HPF's modulated value
  (0x8000517e). Emulator, 2026-10-15: LFO1 at full depth and speed on HPF keeps it
  within 0..127 (the engine clamps); and 0010's cho_gate clamps that load to >= 0,
  so no index can reach the gap at all.
- Emulator, 2026-10-14: no read or write of the whole 1 KB during a session that
  played a pattern and swept every CHORUS, DELAY and REVERB knob to both ends.
It is below __bss_start (0x40235000), so nothing clears it at boot.
"""


# --------------------------------------------------------------------- claims

[[cave]]
owner = "0001-scale-lock"
addr  = 0x40234860
size  = 0x2d0
note  = "719 B: the six hooks (played notes, step entry, the NOTE encoder's three paths, KEY SCALE name), note_step, the track-lock lookup, the snap and the 35-entry scale remap."

# Played notes: track_play_note at its entry, the one routine both the trig keys and
# note events reach. (The first build hooked handleNoteEvent 0x40060c20 instead,
# which trig keys never pass through - found on hardware, 2026-10-09.) The jmp
# covers `linkw %fp,#-88; moveq #127,%d0` exactly; both are re-emitted.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400b942c
size   = 6
expect = "4e56ffa8707f"
entry  = "play_gate"

# Step entry (hold a trig + play a key): set_step_note at its entry. The jmp lands
# across the prologue's lea and the first half of the moveml; both are re-emitted.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400ac540
size   = 6
expect = "4feffff048d7041c"
entry  = "step_gate"

# The NOTE encoder, no trig held: param_apply_delta at its entry, as rytm-mods' 0002
# does. The stub rewrites the delta argument and continues into stock; both prologue
# instructions are re-emitted. (The first two builds compared the id with 30, the
# track's Level - NOTE is 19 - so this never fired; fixed 2026-10-09.)
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40022f20
size   = 6
expect = "4feffff448d7040c"
entry  = "note_delta_gate"

# The NOTE encoder with trigs held, per held trig: lock_delta_apply at its entry.
# The jmp lands across the prologue's lea and the first half of the moveml; both
# are re-emitted.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40023444
size   = 6
expect = "4feffff048d7041c"
entry  = "lock_delta_gate"

# The NOTE encoder on a directly edited lock: the held-trig routine's
# `lea %sp@(12),%sp; addl %d5,%d0`. The lea is re-emitted; the add is
# REIMPLEMENTED (for NOTE, note_step computes the new value; for anything else the
# stub performs the stock add on a line of its own), so the displaced pair is not
# present verbatim.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x40023afc
size   = 6
expect = "4fef000cd085"
entry  = "lock_add_gate"
reemit = false

# The KEY SCALE value text. Stock pushes names[value] from a 3-entry stack copy;
# the stub pushes the name itself and re-emits only the first instruction. The
# second, the indexed push, is REIMPLEMENTED (it would read past the copy for every
# new value), so the displaced pair is not present verbatim.
[[detour]]
owner  = "0001-scale-lock"
addr   = 0x400d604a
size   = 6
expect = "206e00142f360cf4"
entry  = "key_scale_name"
reemit = false

